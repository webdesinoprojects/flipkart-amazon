; Alembic configuration for the Label Normalizer API.
;
; The database URL is intentionally absent: it is resolved at runtime from the
; validated DATABASE_URL setting in app/migrations/env.py, so a connection
; string with credentials never lives in a committed file.
;
;   alembic upgrade head            apply every pending revision
;   alembic current                 show the stamped revision
;   alembic stamp 0001_core_baseline  adopt a database built by create_all
;
; See docs/MIGRATIONS.md for the upgrade, adoption, and rollback procedures.

[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
