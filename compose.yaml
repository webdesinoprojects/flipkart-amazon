name: label-normalizer

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - ${CADDYFILE_PATH:-./infra/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /config/caddy
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sellerlabel.in}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AUTH_API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--timeout-keep-alive",
        "10",
      ]
    environment: &backend_environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://labels:labels@postgres:5432/labels}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_ROOT: /var/lib/label-normalizer
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
      MAX_BATCH_DOCUMENTS: ${MAX_BATCH_DOCUMENTS:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-120}
      TEMP_FILE_TTL_SECONDS: ${TEMP_FILE_TTL_SECONDS:-3600}
      SAVED_OUTPUT_RETENTION_DAYS: ${SAVED_OUTPUT_RETENTION_DAYS:-30}
      MAX_SAVED_OUTPUT_BYTES: ${MAX_SAVED_OUTPUT_BYTES:-52428800}
      EARLY_ACCESS_DAILY_CREDITS: ${EARLY_ACCESS_DAILY_CREDITS:-100}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      LOCAL_VISION_ENABLED: ${LOCAL_VISION_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-5242880}
      VISION_AUTO_APPROVE_CONFIDENCE: ${VISION_AUTO_APPROVE_CONFIDENCE:-0.85}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_PUBLIC_ORIGINS: ${APP_PUBLIC_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-auth-secret-change-me}
      AUTH_COOKIE_PREFIX: ${AUTH_COOKIE_PREFIX:-ln}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_IDLE_SECONDS: ${AUTH_SESSION_IDLE_SECONDS:-43200}
      AUTH_SESSION_ABSOLUTE_SECONDS: ${AUTH_SESSION_ABSOLUTE_SECONDS:-2592000}
      AUTH_SESSION_TOUCH_SECONDS: ${AUTH_SESSION_TOUCH_SECONDS:-60}
      AUTH_MAX_SESSIONS_PER_USER: ${AUTH_MAX_SESSIONS_PER_USER:-20}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-4}
      AUTH_PASSWORD_MAX_BYTES: ${AUTH_PASSWORD_MAX_BYTES:-1024}
      AUTH_ARGON2_TIME_COST: ${AUTH_ARGON2_TIME_COST:-3}
      AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-65536}
      AUTH_ARGON2_PARALLELISM: ${AUTH_ARGON2_PARALLELISM:-2}
      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-false}
      AUTH_VERIFICATION_TOKEN_TTL_SECONDS: ${AUTH_VERIFICATION_TOKEN_TTL_SECONDS:-86400}
      AUTH_RESET_TOKEN_TTL_SECONDS: ${AUTH_RESET_TOKEN_TTL_SECONDS:-1800}
      AUTH_AUDIT_STORE_IP_PREFIX: ${AUTH_AUDIT_STORE_IP_PREFIX:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TIMEOUT_SECONDS: ${RATE_LIMIT_TIMEOUT_SECONDS:-0.25}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-30}
      RATE_LIMIT_LOGIN_ACCOUNT_MAX: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_REGISTER_IP_MAX: ${RATE_LIMIT_REGISTER_IP_MAX:-10}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_EMAIL_IP_MAX: ${RATE_LIMIT_EMAIL_IP_MAX:-10}
      RATE_LIMIT_EMAIL_ACCOUNT_MAX: ${RATE_LIMIT_EMAIL_ACCOUNT_MAX:-5}
      RATE_LIMIT_EMAIL_WINDOW_SECONDS: ${RATE_LIMIT_EMAIL_WINDOW_SECONDS:-3600}
      RATE_LIMIT_RESET_IP_MAX: ${RATE_LIMIT_RESET_IP_MAX:-20}
      RATE_LIMIT_RESET_WINDOW_SECONDS: ${RATE_LIMIT_RESET_WINDOW_SECONDS:-3600}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-accounts@sellerlabel.in}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SellerLabel}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-sellerlabels@gmail.com}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-16384}
    expose:
      - "8000"
    volumes:
      - temporary_files:/var/lib/label-normalizer
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--beat",
        "--schedule=/tmp/celerybeat-schedule",
        "--concurrency=${WORKER_CONCURRENCY:-2}",
        "--max-tasks-per-child=50",
      ]
    environment: *backend_environment
    volumes:
      - temporary_files:/var/lib/label-normalizer
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  storage-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "0:0"
    command:
      [
        "python",
        "-c",
        "import os; os.makedirs('/var/lib/label-normalizer', exist_ok=True); os.chown('/var/lib/label-normalizer', 1001, 1001)",
      ]
    volumes:
      - temporary_files:/var/lib/label-normalizer
    read_only: true
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *backend_environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mailpit/
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    expose:
      - "1025"
      - "8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: labels
      POSTGRES_USER: labels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labels}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labels -d labels"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  temporary_files:
  caddy_data:
  caddy_config:
  mailpit_data:
